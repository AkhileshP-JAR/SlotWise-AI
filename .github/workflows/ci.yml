name: SlotWise AI CI

on:
  push:
    branches: [main, master, "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Code Formatting Check
        run: python -m ruff format --check backend frontend scripts

      - name: Ruff Linting & Type Rules Check
        run: python -m ruff check backend frontend scripts

      - name: Verify Database Migrations (Alembic)
        run: python -m alembic upgrade head

  pipeline-and-tests:
    name: Pipeline, Audit & Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Master Data (Small Profile)
        run: python scripts/generate_data.py --profile small

      - name: Validate 18 Business & Physical Rules
        run: python scripts/validate_data.py --profile small

      - name: Verify Deterministic Reproducibility
        run: python scripts/reproduce_dataset.py --profile small

      - name: Run End-to-End Simulation & Optimization
        run: python scripts/run_simulation.py --profile small

      - name: Train ML Forecaster & Log MLflow Experiment
        run: python scripts/train_forecaster.py --profile small

      - name: Run Independent SQL Integrity Auditor
        run: python scripts/audit_integrity.py --db data/slotwise.db --expect-post-optimization

      - name: Execute Full Pytest Suite
        run: python -m pytest -v
        env:
          PYTHONPATH: .
          CONFIG_PROFILE: small
          ENABLE_ML: "true"
          LLM_PROVIDER: "none"
