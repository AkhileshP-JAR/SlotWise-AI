[project]
name = "slotwise-ai"
version = "1.0.0"
description = "Intelligent Warehouse Slotting & Optimization Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 115

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"frontend/**/*.py" = ["E402"]
